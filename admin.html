<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b1c"><title>Anna's Song · Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="./">anna<span>’</span>s song</a><a class="admin-link" href="./">← Public site</a></header><main class="admin-shell"><section class="admin-heading"><p class="eyebrow">PRIVATE STUDIO</p><h1>Admin panel</h1><p class="sub">Sign in to manage the song collection.</p></section><section id="login-card" class="panel"><h2>Admin login</h2><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username" placeholder="Your admin email"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Password"></label><button class="primary" type="submit">Sign in</button></form><p id="login-msg" class="message"></p></section><section id="dashboard" hidden><div class="admin-bar"><div><h2>Your songs</h2><p id="admin-email" class="muted"></p></div><button id="logout" class="ghost">Log out</button></div><section class="panel"><h2 id="form-title">Add a song</h2><form id="song-form"><input id="edit-id" type="hidden"><label>Song title<input id="title" required maxlength="140" placeholder="Song name"></label><label>Singer / artist<input id="artist" maxlength="100" value="Anna" placeholder="Anna"></label><label>MP3 audio file<input id="audio-file" type="file" accept="audio/*" required></label><label>Cover photo <span class="muted">(optional)</span><input id="cover-file" type="file" accept="image/*"></label><div class="form-actions"><button class="primary" type="submit">Upload song</button><button id="cancel-edit" class="ghost" type="button" hidden>Cancel edit</button></div></form><p id="form-msg" class="message"></p></section><section class="panel"><h2>Manage collection</h2><div id="admin-list" class="admin-list"><p class="muted">Loading…</p></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
